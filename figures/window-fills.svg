<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460"
     font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#000000">
  <title>The window fills as the agent works</title>
  <desc>The agentic loop as five steps, prompt, read a file, run a command, output returns, next step, joined by arrows; under each step the context window, drawn as a bar, is filled from beneath a little more than at the step before, with the larger rises after a file is read and after a command's output returns. The levels illustrate the claim; they are not measured.</desc>
  <style>
    .arm   { fill: #ffffff; stroke: #1f6fb2; stroke-width: 3; }
    .frame { fill: none; stroke: #8a8a8a; stroke-width: 2; }
    .level { fill: #1f6fb2; fill-opacity: 0.35; stroke: none; }
    .lbl   { font-size: 30px; }
    .armlbl{ font-size: 32px; font-weight: bold; }
    .wire  { fill: none; stroke: #8a8a8a; stroke-width: 3; }
    .head  { fill: #8a8a8a; stroke: none; }
  </style>

  <rect width="1600" height="460" fill="#ffffff"/>

  <!-- The loop -->
  <rect class="arm" x="40" y="20" width="250" height="60"/>
  <text class="armlbl" x="165" y="61" text-anchor="middle">prompt</text>

  <line class="wire" x1="296" y1="50" x2="333" y2="50"/>
  <polygon class="head" points="349,50 333,42 333,58"/>

  <rect class="arm" x="355" y="20" width="250" height="60"/>
  <text class="armlbl" x="480" y="61" text-anchor="middle">read a file</text>

  <line class="wire" x1="611" y1="50" x2="648" y2="50"/>
  <polygon class="head" points="664,50 648,42 648,58"/>

  <rect class="arm" x="670" y="20" width="250" height="60"/>
  <text class="armlbl" x="795" y="61" text-anchor="middle">run a command</text>

  <line class="wire" x1="926" y1="50" x2="963" y2="50"/>
  <polygon class="head" points="979,50 963,42 963,58"/>

  <rect class="arm" x="985" y="20" width="250" height="60"/>
  <text class="armlbl" x="1110" y="61" text-anchor="middle">output returns</text>

  <line class="wire" x1="1241" y1="50" x2="1278" y2="50"/>
  <polygon class="head" points="1294,50 1278,42 1278,58"/>

  <rect class="arm" x="1300" y="20" width="250" height="60"/>
  <text class="armlbl" x="1425" y="61" text-anchor="middle">next step</text>

  <!-- The window under each step, filled from beneath -->
  <rect class="level" x="110" y="344" width="110" height="50"/>
  <rect class="frame" x="110" y="114" width="110" height="280"/>
  <text class="lbl" x="165" y="432" text-anchor="middle">window</text>

  <rect class="level" x="425" y="264" width="110" height="130"/>
  <rect class="frame" x="425" y="114" width="110" height="280"/>
  <text class="lbl" x="480" y="432" text-anchor="middle">window</text>

  <rect class="level" x="740" y="249" width="110" height="145"/>
  <rect class="frame" x="740" y="114" width="110" height="280"/>
  <text class="lbl" x="795" y="432" text-anchor="middle">window</text>

  <rect class="level" x="1055" y="164" width="110" height="230"/>
  <rect class="frame" x="1055" y="114" width="110" height="280"/>
  <text class="lbl" x="1110" y="432" text-anchor="middle">window</text>

  <rect class="level" x="1370" y="134" width="110" height="260"/>
  <rect class="frame" x="1370" y="114" width="110" height="280"/>
  <text class="lbl" x="1425" y="432" text-anchor="middle">window</text>
</svg>
