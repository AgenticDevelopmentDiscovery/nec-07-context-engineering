<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400"
     font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#000000">
  <title>Two stores</title>
  <desc>A language model draws on two stores: its weights, which hold what it was trained on, and its context window, which holds what it can use now: the system prompt, instruction files such as CLAUDE.md, auto memory, skill descriptions, the conversation, file reads and tool output.</desc>
  <style>
    .box   { fill: #eeeeee; stroke: #8a8a8a; stroke-width: 2; }
    .arm   { fill: #ffffff; stroke: #1f6fb2; stroke-width: 3; }
    .lbl   { font-size: 30px; }
    .armlbl{ font-size: 32px; font-weight: bold; }
  </style>

  <rect width="1600" height="400" fill="#ffffff"/>

  <!-- Weights -->
  <rect class="arm" x="40" y="20" width="400" height="360"/>
  <text class="armlbl" x="240" y="184" text-anchor="middle">weights</text>
  <text class="lbl" x="240" y="228" text-anchor="middle">what it was trained on</text>

  <!-- Window -->
  <rect class="arm" x="500" y="20" width="1060" height="360"/>
  <text class="armlbl" x="530" y="70">window</text>
  <text class="lbl" x="690" y="70">what it can use now</text>

  <rect class="box" x="530" y="94" width="500" height="52"/>
  <text class="lbl" x="548" y="130">system prompt</text>

  <rect class="box" x="530" y="160" width="500" height="52"/>
  <text class="lbl" x="548" y="196">instruction files (CLAUDE.md)</text>

  <rect class="box" x="530" y="226" width="500" height="52"/>
  <text class="lbl" x="548" y="262">auto memory</text>

  <rect class="box" x="530" y="292" width="500" height="52"/>
  <text class="lbl" x="548" y="328">skill descriptions</text>

  <rect class="box" x="1050" y="94" width="490" height="52"/>
  <text class="lbl" x="1068" y="130">conversation</text>

  <rect class="box" x="1050" y="160" width="490" height="52"/>
  <text class="lbl" x="1068" y="196">file reads</text>

  <rect class="box" x="1050" y="226" width="490" height="52"/>
  <text class="lbl" x="1068" y="262">tool output</text>
</svg>
