<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"
     font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#000000">
  <title>What enters the window, and when</title>
  <desc>Three columns, At launch, Each turn and At compaction, each a stack of what enters the context window at that moment; below, what the add-dir flag (an extra directory) loads and does not load by default.</desc>
  <style>
    .box   { fill: #eeeeee; stroke: #8a8a8a; stroke-width: 2; }
    .lbl   { font-size: 30px; }
    .head  { font-size: 34px; font-weight: bold; fill: #1f6fb2; }
    .rule  { stroke: #1f6fb2; stroke-width: 3; }
    .tag   { fill: #ffffff; stroke: #1f6fb2; stroke-width: 3; }
    .taglbl{ font-size: 30px; font-weight: bold; fill: #1f6fb2; }
    .sub   { font-size: 30px; font-weight: bold; }
  </style>

  <rect width="1600" height="560" fill="#ffffff"/>

  <!-- Column 1: At launch -->
  <text class="head" x="40" y="50">At launch</text>
  <line class="rule" x1="40" y1="62" x2="510" y2="62"/>

  <rect class="box" x="40" y="76" width="470" height="44"/>
  <text class="lbl" x="58" y="107">system prompt</text>

  <rect class="box" x="40" y="128" width="470" height="44"/>
  <text class="lbl" x="58" y="159">tool definitions</text>

  <rect class="box" x="40" y="180" width="470" height="104"/>
  <text class="lbl" x="58" y="211">project-root CLAUDE.md</text>
  <text class="lbl" x="58" y="243">and its @path imports</text>
  <text class="lbl" x="58" y="275">(files it pulls in)</text>

  <rect class="box" x="40" y="292" width="470" height="44"/>
  <text class="lbl" x="58" y="323">skill descriptions</text>

  <rect class="box" x="40" y="344" width="470" height="44"/>
  <text class="lbl" x="58" y="375">auto-memory index</text>

  <!-- Column 2: Each turn -->
  <text class="head" x="565" y="50">Each turn</text>
  <line class="rule" x1="565" y1="62" x2="1035" y2="62"/>

  <rect class="box" x="565" y="76" width="470" height="44"/>
  <text class="lbl" x="583" y="107">your message</text>

  <rect class="box" x="565" y="128" width="470" height="44"/>
  <text class="lbl" x="583" y="159">@file in a prompt</text>

  <rect class="box" x="565" y="180" width="470" height="72"/>
  <text class="lbl" x="583" y="209">the agent's file reads</text>
  <text class="lbl" x="583" y="241">and tool output</text>

  <rect class="box" x="565" y="260" width="470" height="72"/>
  <text class="lbl" x="583" y="289">a subdirectory CLAUDE.md</text>
  <text class="lbl" x="583" y="321">when files there are read</text>

  <rect class="box" x="565" y="340" width="470" height="44"/>
  <text class="lbl" x="583" y="371">rules scoped to file paths</text>

  <rect class="box" x="565" y="392" width="470" height="44"/>
  <text class="lbl" x="583" y="423">a skill's body on use</text>

  <!-- Column 3: At compaction -->
  <text class="head" x="1090" y="50">At compaction</text>
  <line class="rule" x1="1090" y1="62" x2="1560" y2="62"/>

  <rect class="box" x="1090" y="76" width="470" height="72"/>
  <text class="lbl" x="1108" y="105">the conversation</text>
  <text class="lbl" x="1108" y="137">summarised</text>

  <rect class="box" x="1090" y="156" width="470" height="72"/>
  <text class="lbl" x="1108" y="185">project-root CLAUDE.md</text>
  <text class="lbl" x="1108" y="217">re-read from disk</text>

  <!-- Row: the add-dir flag -->
  <line x1="40" y1="456" x2="1560" y2="456" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="6 6"/>

  <rect class="tag" x="40" y="472" width="340" height="72"/>
  <text class="taglbl" x="210" y="501" text-anchor="middle">--add-dir</text>
  <text class="lbl" x="210" y="533" text-anchor="middle">(an extra directory)</text>

  <rect class="box" x="400" y="472" width="570" height="72"/>
  <text class="sub" x="418" y="501">loaded</text>
  <text class="lbl" x="418" y="533">skills, commands, subagents</text>

  <rect class="box" x="990" y="472" width="570" height="72"/>
  <text class="sub" x="1008" y="501">not loaded by default</text>
  <text class="lbl" x="1008" y="533">CLAUDE.md, rules</text>
</svg>
