<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="372" viewBox="0 0 1600 372"
     font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#000000">
  <title>Three copies, three windows</title>
  <desc>One starting repository and one prompt feed three arms that differ only in CLAUDE.md: A has none, B has the shipped 240-line manual, C has a 33-line index the team wrote; each arm has five unattended runs; all are scored on seven observables fixed before any run.</desc>
  <style>
    .box   { fill: #eeeeee; stroke: #8a8a8a; stroke-width: 2; }
    .arm   { fill: #ffffff; stroke: #1f6fb2; stroke-width: 3; }
    .lbl   { font-size: 30px; }
    .armlbl{ font-size: 32px; font-weight: bold; }
    .wire  { fill: none; stroke: #8a8a8a; stroke-width: 2; }
  </style>

  <rect width="1600" height="372" fill="#ffffff"/>

  <!-- Shared input -->
  <rect class="box" x="400" y="20" width="800" height="52"/>
  <text class="lbl" x="800" y="56" text-anchor="middle">same starting repository, same prompt</text>

  <!-- Wires: input to arms -->
  <polyline class="wire" points="800,72 800,88 280,88 280,104"/>
  <polyline class="wire" points="800,72 800,104"/>
  <polyline class="wire" points="800,72 800,88 1320,88 1320,104"/>

  <!-- Arms -->
  <rect class="arm" x="30" y="104" width="500" height="96"/>
  <text class="armlbl" x="280" y="163" text-anchor="middle">A — no CLAUDE.md</text>

  <rect class="arm" x="550" y="104" width="500" height="96"/>
  <text class="armlbl" x="800" y="145" text-anchor="middle">B — the shipped CLAUDE.md,</text>
  <text class="armlbl" x="800" y="183" text-anchor="middle">a 240-line manual</text>

  <rect class="arm" x="1070" y="104" width="500" height="96"/>
  <text class="armlbl" x="1320" y="145" text-anchor="middle">C — a 33-line index</text>
  <text class="armlbl" x="1320" y="183" text-anchor="middle">we wrote</text>

  <!-- Wires: arms to runs -->
  <line class="wire" x1="280" y1="200" x2="280" y2="224"/>
  <line class="wire" x1="800" y1="200" x2="800" y2="224"/>
  <line class="wire" x1="1320" y1="200" x2="1320" y2="224"/>

  <!-- Runs -->
  <rect class="box" x="130" y="224" width="300" height="48"/>
  <text class="lbl" x="280" y="257" text-anchor="middle">5 unattended runs</text>

  <rect class="box" x="650" y="224" width="300" height="48"/>
  <text class="lbl" x="800" y="257" text-anchor="middle">5 unattended runs</text>

  <rect class="box" x="1170" y="224" width="300" height="48"/>
  <text class="lbl" x="1320" y="257" text-anchor="middle">5 unattended runs</text>

  <!-- Wires: runs to observables -->
  <line class="wire" x1="280" y1="272" x2="280" y2="296"/>
  <line class="wire" x1="800" y1="272" x2="800" y2="296"/>
  <line class="wire" x1="1320" y1="272" x2="1320" y2="296"/>

  <!-- Observables -->
  <rect class="box" x="30" y="296" width="1540" height="52"/>
  <text class="lbl" x="800" y="332" text-anchor="middle">7 observables, fixed before any run</text>
</svg>
